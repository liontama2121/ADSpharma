<!DOCTYPE html>

  <link rel="stylesheet" href="css/styles.css?v=9" />

  <style>
    /* === Coming soon: reusa el sistema del hero, centrado === */
    .cs {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: clamp(2.5rem, 6vh, 5rem) 24px;
      overflow: hidden;
    }
    .cs-inner {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.4rem;
      max-width: 640px; width: 100%;
    }
    .cs-logo-wrap { position: relative; display: grid; place-items: center; }
    .cs-logo {
      position: relative; z-index: 2;
      width: clamp(180px, 42vw, 300px);
      height: auto;
      filter: drop-shadow(0 20px 50px rgba(77,168,255,0.25));
      animation: heroFloat 4s ease-in-out infinite;
    }
    .cs-badge {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-mid);
      backdrop-filter: blur(8px);
    }
    .cs-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--glow-cyan);
      box-shadow: 0 0 12px var(--glow-cyan);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .cs-title {
      font-family: "Nunito", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      line-height: 1.12;
      letter-spacing: -0.015em;
      background: var(--brand);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .cs-sub { color: var(--text-mid); font-size: clamp(1rem, 1.4vw, 1.18rem); max-width: 520px; }
    .cs-ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 0.4rem; }
    .cs-foot {
      margin-top: 1.6rem;
      font-size: 0.82rem; color: var(--text-low);
      display: flex; flex-direction: column; gap: 4px;
    }
    .cs-foot a { color: var(--text-mid); }
    .cs-foot a:hover { color: var(--text-hi); }
    @media (max-width: 768px) {
      .cs-ctas { width: 100%; }
      .cs-ctas .btn { flex: 1 1 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cs-logo, .hero-orb { animation: none; }
    }
  </style>
</head>
<body>

  <section class="cs hero">
    <div class="hero-orbs" aria-hidden="true">
      <div class="hero-orb hero-orb-1"></div>
      <div class="hero-orb hero-orb-2"></div>
      <div class="hero-orb hero-orb-3"></div>
      <div class="hero-orb hero-orb-4"></div>
      <div class="hero-orb hero-orb-5"></div>
    </div>

    <div class="cs-inner">
      <div class="cs-logo-wrap">
        <div class="hero-logo-glow"></div>
        <img class="cs-logo" src="image/logo_home.webp" alt="ADS PHARMA" loading="eager" />
      </div>

      <span class="cs-badge"><span class="dot"></span>Sitio en construcción</span>

      <h1 class="cs-title">Próximamente</h1>
      <p class="cs-sub">Estamos construyendo una experiencia para el cuidado vital del paciente. Muy pronto, ADS PHARMA en línea.</p>

      <div class="cs-ctas">
        <a class="btn btn-wa" href="https://wa.me/573203035503?text=Hola%20ADS%20PHARMA%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20su%20portafolio." target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.9 11.9 0 0 0 3 18.5L1.5 24l5.7-1.5A11.9 11.9 0 1 0 20.5 3.5Z"/></svg>
          Escríbenos por WhatsApp
        </a>
        <a class="btn btn-ghost" href="mailto:comunicaciones@adspharma.co">Contáctanos</a>
      </div>

      <div class="cs-foot">
        <span>Calle 102A No. 70 - 77/79, Bogotá D.C., Colombia</span>
        <span>(601) 745 0880 · <a href="mailto:comunicaciones@adspharma.co">comunicaciones@adspharma.co</a></span>
        <span>© 2026 ADS PHARMA S.A.S.</span>
      </div>
    </div>
  </section>

</body>
</html>
